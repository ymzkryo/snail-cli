name: Version Bump and Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve release version
        id: bump
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null; then
            # Cargo.toml still points at a released version: bump the patch.
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "v${CURRENT} is already released, bumping: $CURRENT -> $NEW_VERSION"
          else
            # Version was raised by hand (minor / major): release it as-is.
            NEW_VERSION="$CURRENT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Releasing version set in Cargo.toml: $NEW_VERSION"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml
        if: steps.bump.outputs.bumped == 'true'
        run: |
          sed -i "s/^version = \"${{ steps.bump.outputs.current }}\"/version = \"${{ steps.bump.outputs.new_version }}\"/" Cargo.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump.outputs.bumped }}" = "true" ]; then
            git add Cargo.toml
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          fi
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master --tags

      - name: Build release binary
        run: cargo build --release

      - name: Package binary and templates
        run: |
          mkdir -p dist/snail
          cp target/release/snail dist/snail/
          cp -r templates dist/snail/
          tar -czf "snail-linux-amd64.tar.gz" -C dist snail

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            snail-linux-amd64.tar.gz
